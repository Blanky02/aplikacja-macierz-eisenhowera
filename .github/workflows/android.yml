name: Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Upload test log
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fokus-unit-test-log-${{ github.run_number }}
          path: unit-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Expose unit-test failure summary
        if: steps.unit_tests.outcome == 'failure'
        shell: bash
        run: |
          summary=$(grep -iE 'FAILURE|What went wrong|Execution failed|error:|e: |\.kt:[0-9]+|Caused by:|> Task' unit-tests.log | tail -120 | tr '\n' ' ' | tr '\r' ' ' | sed 's/%/%25/g; s/|/%7C/g')
          echo "::error file=unit-tests.log,line=1::${summary}"

      - name: Fail if unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fokus-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
